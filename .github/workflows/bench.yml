name: Benchmark

# Manual only: shared CI runners are too noisy to gate pull requests on performance.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per measurement
        default: "10"
      connections:
        description: Concurrent connections
        default: "32"

env:
  POSTGREST_VERSION: v16.5

jobs:
  bench:
    # Paused on purpose: every GitHub job is off while the packages are split. Remove this line to turn it back on.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Download PostgREST ${{ env.POSTGREST_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/postgrest"
          curl -fsSL "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP/postgrest"
      - name: Run the benchmark
        run: bun run bench
        env:
          POSTGREST_BIN: ${{ runner.temp }}/postgrest/postgrest
          BENCH_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          DURATION: ${{ inputs.duration }}
          CONNECTIONS: ${{ inputs.connections }}
      - name: Summary
        run: cat bench/results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
