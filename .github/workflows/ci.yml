name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which suites a pull request has to run. Each package owns its tests (`packages/*/tests`), so a
  # change to one package need not run the other's. `packages/core` is what both packages are built
  # on, so it runs both; the shared harness in `tests/`, a config, a script or the lockfile runs the
  # shared suite as well. A push to main runs everything (`paths-filter` reports every filter as
  # changed when there is no base to diff against).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      query: ${{ steps.filter.outputs.query }}
      rest: ${{ steps.filter.outputs.rest }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/adapters/**'
              - 'tests/**'
              - 'scripts/**'
              - 'package.json'
              - 'tsconfig.json'
              - 'bun.lock'
              - '.github/workflows/*.yml'
              - '.github/actions/**'
            core: &core
              - 'packages/core/**'
            query:
              - *shared
              - *core
              - 'packages/query/**'
            rest:
              - *shared
              - *core
              - 'packages/rest/**'

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
    uses: ./.github/workflows/package-tests.yml
    with:
      name: "@tspg/core"
      package: "@tspg/core"
      tests: ./packages/core/tests/

  query:
    needs: changes
    if: needs.changes.outputs.query == 'true'
    uses: ./.github/workflows/package-tests.yml
    with:
      name: "@tspg/query"
      package: "@tspg/query"
      tests: ./packages/query/tests/

  rest:
    needs: changes
    if: needs.changes.outputs.rest == 'true'
    uses: ./.github/workflows/package-tests.yml
    with:
      name: "@tspg/rest"
      package: "@tspg/rest"
      tests: ./packages/rest/tests/
      # the differential cases against the real PostgREST live in packages/rest/tests/compare
      postgrest: true

  # The suites that are no package's -- the compiled docs and the adapters -- plus the built library
  # on Node. Checked across the whole repo, because what reaches it is shared.
  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    uses: ./.github/workflows/package-tests.yml
    with:
      name: Shared suites, Node
      tests: ./tests/
      smoke: true

